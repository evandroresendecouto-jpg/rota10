<style>

  .list { list-style: none; margin: 0; padding: 0; }

  .tablewrap { overflow-x: auto; }

  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); } td.num, th.num { text-align: right; }
  .foot { margin: 18px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

  .sugg button:hover, .sugg button:focus-visible { background: var(--brand-soft); }
  .sugg .st { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .sugg .ss { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .sugg .sm { padding: 8px 10px; font-size: 13px; color: var(--muted); }
  .okline { margin: -6px 0 12px; font-size: 13px; color: var(--brand); }
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .balloon { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); width: min(94vw, 480px); background: var(--surface); color: var(--fg); border: 2px solid var(--fee); border-radius: 16px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.28); z-index: 30; }
  .balloon h3 { margin: 0 0 6px; font: 700 17px var(--font-display); }
  .stars { display: flex; gap: 6px; margin-top: 8px; }
  .stars button { appearance: none; flex: 1; min-height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--fee); border-radius: 10px; font-size: 20px; cursor: pointer; }
  .photobox label { cursor: pointer; color: var(--brand); font-weight: 600; display: block; padding: 6px 0; }
  select { font: 500 16px var(--font-body); min-height: 48px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); width: 100%; }
  .card.urg { border: 2px solid var(--danger); background: var(--danger-soft); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  html.fs-1 body { font-size: 18px; } html.fs-1 .small { font-size: 15px; } html.fs-1 .btn { font-size: 18px; } html.fs-1 h2 { font-size: 21px; } html.fs-1 .pill { font-size: 14px; }
  html.fs-2 body { font-size: 21px; } html.fs-2 .small { font-size: 17px; } html.fs-2 .btn { font-size: 20px; } html.fs-2 h2 { font-size: 24px; } html.fs-2 .pill { font-size: 16px; } html.fs-2 input[type="text"], html.fs-2 input[type="email"], html.fs-2 input[type="password"], html.fs-2 input[type="tel"], html.fs-2 select { font-size: 20px; }
  html.hc { --bg: #000; --surface: #000; --fg: #fff; --muted: #f0f0f0; --line: #fff; --brand: #ffe600; --brand-ink: #000; --brand-soft: #262600; --fee: #ffd24d; --fee-soft: #2a2000; --danger: #ff8f87; --danger-soft: #300; color-scheme: dark; }
  html.hc .pill { background: #222; color: #fff; border: 1px solid #fff; } html.hc .pill.on { color: var(--brand); } html.hc .pill.fee { color: var(--fee); } html.hc .pill.bad { color: var(--danger); }
  html.hc .bar { background: #444; } html.hc .btn.sos { background: #ff3b30; border-color: #fff; color: #fff; }

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, query, where, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7BjOoaRldgrynspRuX_z1FsJk0Onsz6g",
  authDomain: "rota10-b4257.firebaseapp.com",
  projectId: "rota10-b4257",
  storageBucket: "rota10-b4257.firebasestorage.app",
  messagingSenderId: "61157002380",
  appId: "1:61157002380:web:37949abb78a7ddb8e73fa9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- utilidades ---------- */
const FEE = 0.10;
const STATUS = { searching: 'Procurando motorista', accepted: 'Motorista a caminho', arrived: 'Motorista chegou', ongoing: 'Em viagem', done: 'Finalizada', canceled: 'Cancelada' };
const ACTIVE = ['searching', 'accepted', 'arrived', 'ongoing'];
const NEXT = {
  accepted: { to: 'arrived', label: 'Cheguei ao embarque' },
  arrived: { to: 'ongoing', label: 'Iniciar corrida' },
  ongoing: { to: 'done', label: 'Finalizar corrida' }
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (c) => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const parseMoney = (s) => { const n = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) : NaN; };
const ms = (r) => (r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().getTime() : Date.now());
const when = (r) => new Date(ms(r)).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const waLink = (phone) => { const d = String(phone || '').replace(/\D/g, ''); if (d.length < 10) return ''; return 'https://wa.me/' + (d.length <= 11 ? '55' + d : d); };
const plateFmt = (p) => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const PLATE_RE = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;
const safeImg = (s) => (typeof s === 'string' && s.startsWith('data:image/jpeg;base64,') ? s : '');
const telHref = (phone) => { const d = String(phone || '').replace(/\D/g, ''); if (d.length < 10) return ''; return 'tel:+' + (d.length <= 11 ? '55' + d : d); };
const dist = (a, b, c, d) => { const R = 6371, t = (x) => x * Math.PI / 180, dl = t(c - a), dg = t(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const kmFmt = (k) => (k < 1 ? Math.round(k * 1000 / 10) * 10 + ' m' : k.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' km');
function resizeImage(file, max, q, square) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sw = square ? Math.min(img.width, img.height) : img.width, sh = square ? sw : img.height;
      const sx = square ? (img.width - sw) / 2 : 0, sy = square ? (img.height - sh) / 2 : 0;
      const s = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * s), h = Math.round(sh * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      let out = c.toDataURL('image/jpeg', q);
      while (out.length > 130000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
const coordsOf = (s) => {
  const m = String(s || '').match(/-?\d+\.\d+/g);
  if (!m || m.length < 2) return null;
  const lat = +m[0], lng = +m[1];
  return (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) ? { lat, lng } : null;
};
const LEVELS = [{ name: 'Bronze', min: 0, icon: '🥉' }, { name: 'Prata', min: 20, icon: '🥈' }, { name: 'Ouro', min: 60, icon: '🥇' }];
const levelOf = (n) => LEVELS.filter((l) => n >= l.min).pop();
const levelByName = (nm) => LEVELS.find((l) => l.name === nm);
const doneAt = (r) => (r.updatedAt && r.updatedAt.toDate ? r.updatedAt.toDate().getTime() : ms(r));
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
function statsOf(rides) {
  const done = rides.filter((r) => r.status === 'done');
  const now = new Date(), dow = (now.getDay() + 6) % 7;
  const wk = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow).getTime();
  const days = new Set(done.map((r) => dayKey(doneAt(r))));
  let streak = 0; const d = new Date();
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  while (days.has(dayKey(d.getTime()))) { streak++; d.setDate(d.getDate() - 1); }
  const rated = done.filter((r) => r.driverRating);
  return { total: done.length, week: done.filter((r) => doneAt(r) >= wk).length, streak: streak, nRated: rated.length, avg: rated.length ? rated.reduce((a, r) => a + r.driverRating, 0) / rated.length : null };
}
const myCode = () => 'R10' + S.user.uid.slice(0, 6).toUpperCase();
const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);
const friendly = (e) => {
  const c = (e && e.code) || '';
  const map = {
    'auth/email-already-in-use': 'Esse e-mail já tem conta. Toque em Entrar.',
    'auth/invalid-email': 'E-mail inválido. Confira se digitou certo.',
    'auth/weak-password': 'Senha fraca. Use pelo menos 6 caracteres.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.',
    'auth/network-request-failed': 'Sem internet. Confira a conexão e tente de novo.',
    'auth/operation-not-allowed': 'O login por e-mail e senha não está ativado no Firebase.',
    'auth/unauthorized-domain': 'Este endereço do site não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).',
    'permission-denied': 'Sem permissão. Confira se as regras do Firestore foram publicadas.',
    'unavailable': 'Sem conexão com o servidor. Tente de novo.'
  };
  return map[c] || ('Algo deu errado' + (c ? ' (' + c + ')' : '') + '. Tente de novo.');
};

/* ---------- estado ---------- */
const S = { view: 'loading', mode: 'login', role: 'passenger', user: null, profile: null, rides: [], open: [], err: '', banner: '', busy: false, toast: '',
  draft: { face: null, car: null }, editVehicle: false, editEmerg: false, pickup: null, myPos: null,
  partners: [], pins: {}, pLoc: null, dest: null, sugg: { from: null, to: null }, here: null, users: [], refCode: '' };
try { const r = new URLSearchParams(location.search).get('ref'); if (r) localStorage.setItem('rota10_ref', r.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12)); } catch (e) {}
try { S.refCode = localStorage.getItem('rota10_ref') || ''; } catch (e) {}
if (S.refCode) S.mode = 'signup';
let firstAuth = true;
let pendingProfile = null;
let unsubs = [];
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let toastTimer = null;
function say(msg) { $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.hidden = true; }, 3500); }

/* ---------- telas ---------- */
const brand = '<span class="wordmark">Rota<b>10</b></span>';
const route = (r) => '<div class="route"><div><span class="dot"></span><span>' + esc(r.from) + '</span></div><div><span class="dot b"></span><span>' + esc(r.to) + '</span></div></div>';
const contact = (name, phone) => {
  const w = waLink(phone);
  return '<div class="small"><b>' + esc(name || '') + '</b>' + (phone ? ' · ' + esc(phone) : '') + (w ? ' · <a href="' + w + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>';
};

const DRIVER_ACTIVE = ['accepted', 'arrived', 'ongoing'];
const activeRide = () => {
  if (!S.profile) return null;
  const list = S.rides.slice().sort((a, b) => ms(b) - ms(a));
  const set = S.profile.role === 'driver' ? DRIVER_ACTIVE : ACTIVE;
  return list.find((r) => set.includes(r.status)) || null;
};

function drvCard(r) {

function beep() {
  try { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const c = new A();
    [0, 0.35, 0.7].forEach((t) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = 0.25; o.connect(g); g.connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.22); });
    setTimeout(() => { try { c.close(); } catch (e) {} }, 1500); } catch (e) {}
}
function alertUrgent() {
  const p = S.profile; if (!p || p.role !== 'driver' || !p.online || !p.vehicleOk) return;
  const fresh = S.open.filter((r) => r.status === 'searching' && r.modality === 'urgent' && eligible(r, p) && !S.seenUrg[r.id]);
  fresh.forEach((r) => { S.seenUrg[r.id] = 1; });
  if (!S.urgInit) { S.urgInit = true; return; }
  if (!fresh.length || activeRide()) return;
  beep(); try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 600]); } catch (e) {}
  say('🚑 CHAMADA DE URGÊNCIA! Veja o pedido em vermelho.'); speak('Chamada de urgência', true);
}

S.tickets = []; S.viewUid = ''; S.receiptId = '';
const TAR = { baseCents: 400, kmCents: 180, minCents: 30, minFareCents: 700 };
const tar = (k) => (S.cfg && Number.isInteger(S.cfg[k]) ? S.cfg[k] : TAR[k]);
const brl = (c) => (c / 100).toFixed(2).replace('.', ',');
function estimate() {
  if (!S.pickup || !S.dest) return null;
  const km = dist(S.pickup.lat, S.pickup.lng, S.dest.lat, S.dest.lng) * 1.3;
  const min = Math.max(3, Math.round(km / 25 * 60));
  let base = Math.max(tar('minFareCents'), Math.round(tar('baseCents') + km * tar('kmCents') + min * tar('minCents')));
  base = Math.round(base / 50) * 50;
  const pct = S.req.mod === 'urgent' ? urgPct() : 0;
  return { km, min, base, pct, total: Math.round(base * (100 + pct) / 100) };
}
function estHtml() {
  const e = estimate(); if (!e) return '';
  return '<p class="note"><b>Estimativa: ' + fmt(e.total) + '</b> · cerca de ' + kmFmt(e.km) + ' · ~' + e.min + ' min' + (e.pct ? ' (inclui +' + e.pct + '% de urgência)' : '') + '<br><span class="small">É uma estimativa. O motorista confirma o valor ao aceitar e você pode cancelar antes de ele chegar.</span></p>';

let map = null, mapEl = null, mk = {}, userMoved = false, mapRide = null;
function setMarker(name, lat, lng, html) {
  if (lat == null || lng == null) { if (mk[name]) { map.removeLayer(mk[name]); delete mk[name]; } return; }
  if (mk[name]) mk[name].setLatLng([lat, lng]);
  else mk[name] = L.marker([lat, lng], { icon: L.divIcon({ className: 'mk', html: html, iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map);
}
function updateMarkers() {
  if (!map || !document.getElementById('mapslot') || !S.profile) return;

  if (mapRide !== r.id) { mapRide = r.id; userMoved = false; }
  const driver = S.profile.role === 'driver';

  const car = driver ? (S.myPos ? [S.myPos.lat, S.myPos.lng] : null) : (r.driverLat != null ? [r.driverLat, r.driverLng] : null);
  setMarker('pick', pk ? pk[0] : null, pk ? pk[1] : null, '<div class="pin">📍</div>');
  setMarker('car', car ? car[0] : null, car ? car[1] : null, '<div class="pin">🚗</div>');

  setMarker('dest', dp ? dp[0] : null, dp ? dp[1] : null, '<div class="pin">🏁</div>');
  const pts = (r.status === 'ongoing' ? [car, dp] : [pk, car]).filter(Boolean);
  if (!userMoved && pts.length) { if (pts.length === 1) map.setView(pts[0], 16); else map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 }); }
  const info = document.getElementById('mapinfo'); if (info) info.textContent = mapInfoText(r);
}
function mountMap() {
  const slot = document.getElementById('mapslot'); if (!slot) return;
  if (typeof L === 'undefined') { slot.innerHTML = '<p class="small muted" style="padding:12px">Não foi possível carregar o mapa. Confira a internet.</p>'; return; }
  if (!mapEl) {
    mapEl = document.createElement('div'); mapEl.style.cssText = 'width:100%;height:100%';
    map = L.map(mapEl).setView([-18.9186, -48.2772], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

function wakeLock() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { gps.lock = l; }).catch(() => {}); } catch (e) {} }
function stopGps() {
  if (gps.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(gps.watch);
  gps.watch = null; gps.key = null; gps.rideId = null; gps.last = 0; S.myPos = null;
  try { if (gps.lock) gps.lock.release(); } catch (e) {} gps.lock = null;

function syncGps() {

  const want = driver && (act || S.profile.online) ? (act ? act.id : 'online') : null;

/* ---------- endereço com sugestões (Photon / OpenStreetMap) ---------- */
const PHOTON = 'https://photon.komoot.io';
const BBOX = '-48.55,-19.15,-48.00,-18.70';
const CENTER = { lat: -18.9186, lng: -48.2772 };
const geoCache = new Map(); const seqOf = { from: 0, to: 0 }; const typing = {};
async function photon(path) { const r = await fetch(PHOTON + path); if (!r.ok) throw new Error('http ' + r.status); return r.json(); }
function placeOf(f) {
  const p = f.properties || {}, c = (f.geometry && f.geometry.coordinates) || [];
  if (typeof c[0] !== 'number' || typeof c[1] !== 'number') return null;
  const st = p.street ? p.street + (p.housenumber ? ', ' + p.housenumber : '') : '';
  const isStreet = p.osm_key === 'highway';
  let title = p.name || st, sub = [];
  if (isStreet) title = p.name || st;
  else if (p.name && st) { title = p.name; sub.push(st); }
  else if (st) title = st;
  const hood = p.district || p.suburb || p.locality || '', city = p.city || p.county || '';
  const area = [hood, city].filter(Boolean).join(' · ');
  if (area) sub.push(area);
  title = title || city || 'Local';
  return { title: title, sub: sub.join(' · '), lat: c[1], lng: c[0], text: [(!isStreet && p.name && st) ? p.name + ', ' + st : title, hood, city].filter(Boolean).join(', ') };
}
function suggHtml(field) {

    (sg.msg ? '<li class="sm">' + esc(sg.msg) + '</li>' : '') + '</ul>';
}
function renderSugg(field) { const el = document.querySelector('.suggbox[data-for="' + field + '"]'); if (el) el.innerHTML = suggHtml(field); }
function hereItem() {
  if (!S.here) return null;
  return { title: '📍 Local atual', sub: S.here.text || 'Usar minha localização (GPS)', lat: S.here.lat, lng: S.here.lng, text: S.here.text || 'Minha localização atual (GPS)' };
}
function locateHere() {
  const fresh = S.here && Date.now() - S.here.ts < 90000;
  const show = () => { const it = hereItem(); const inp = document.querySelector('[data-form="request"] [name="from"]'); if (it && inp && !inp.value.trim()) { S.sugg.from = { items: [it] }; renderSugg('from'); } };
  if (fresh) { show(); return; }
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((pos) => {
    S.here = { lat: pos.coords.latitude, lng: pos.coords.longitude, text: null, ts: Date.now() };
    show();
    photon('/reverse?lat=' + S.here.lat.toFixed(5) + '&lon=' + S.here.lng.toFixed(5) + '&limit=1').then((j) => {
      const pl = j.features && j.features[0] && placeOf(j.features[0]);

function onType(field, q) {

  q = q.trim();
  if (q.length < 3) { const it = field === 'from' ? hereItem() : null; S.sugg[field] = it ? { items: [it] } : null; renderSugg(field); return; }
  typing[field] = setTimeout(async () => {
    const seq = ++seqOf[field];
    try {
      let items = geoCache.get(q);
      if (!items) {
        const j = await photon('/api/?q=' + encodeURIComponent(q) + '&limit=6&lat=' + CENTER.lat + '&lon=' + CENTER.lng + '&bbox=' + BBOX);
        const seen = new Set();
        items = (j.features || []).map(placeOf).filter(Boolean).filter((x) => { const k = x.title + '|' + x.sub; if (seen.has(k)) return false; seen.add(k); return true; });
        geoCache.set(q, items);
      }
      if (seq !== seqOf[field]) return;
      S.sugg[field] = items.length ? { items: items } : { items: [], msg: 'Nenhum endereço encontrado. Confira o nome da rua.' };
    } catch (e) {
      if (seq !== seqOf[field]) return;
      S.sugg[field] = { items: [], msg: 'Busca de endereço indisponível agora. Digite o endereço completo.' };

let alerted = {}; let balloonTimer = null;

function checkPartners() {
  if (!S.myPos || !S.partners.length) return;
  const now = Date.now();
  for (const pt of S.partners) {
    if (pt.active === false || typeof pt.lat !== 'number' || typeof pt.lng !== 'number') continue;
    const m = dist(S.myPos.lat, S.myPos.lng, pt.lat, pt.lng) * 1000;
    if (m <= (pt.radius || 150) && !(alerted[pt.id] && now - alerted[pt.id] < 6 * 3600 * 1000)) {
      alerted[pt.id] = now;
      try { localStorage.setItem('rota10_alerted', JSON.stringify(alerted)); } catch (e) {}
      showBalloon(pt, m); return;
    }
  }
}

  else if (act === 'user-docs') { S.viewUid = S.viewUid === b.dataset.id ? '' : b.dataset.id; render(); }
  else if (act === 'user-approve') { run(() => updateDoc(doc(db, 'users', b.dataset.id), { approved: b.dataset.v === '1' }), b.dataset.v === '1' ? 'Motorista aprovado.' : 'Aprovação removida.'); }
  else if (act === 'user-block') { run(() => updateDoc(doc(db, 'users', b.dataset.id), { blocked: b.dataset.v === '1' }), b.dataset.v === '1' ? 'Usuário bloqueado.' : 'Usuário desbloqueado.'); }
  else if (act === 'mod-urgent') { S.req.mod = 'urgent'; S.req.pref = 'any'; render(); window.scrollTo(0, 0); }
  else if (act === 'mod-normal') { S.req.mod = 'normal'; render(); }
  else if (act === 'more-on') { S.req.more = true; render(); }
  else if (act === 'more-off') { S.req.more = false; render(); }
  else if (act === 'save-access') { const a = S.req.access.slice(); run(async () => { await updateDoc(doc(db, 'users', S.user.uid), { access: a }); S.profile.access = a; }, 'Necessidades salvas como padrão.'); }
  else if (act === 'edit-prefs') { S.editPrefs = true; render(); }
  else if (act === 'close-prefs') { S.editPrefs = false; render(); }
  else if (act === 'women-ok') { run(() => updateDoc(doc(db, 'users', b.dataset.id), { womenApproved: b.dataset.v === '1' })); }
  else if (act === 'a11y-fs') { A11.fs = parseInt(b.dataset.v, 10) || 0; saveA11(); }
  else if (act === 'a11y-hc') { A11.hc = !A11.hc; saveA11(); }
  else if (act === 'a11y-voice') { A11.voice = !A11.voice; saveA11(); if (A11.voice) speak('Avisos falados ligados.', true); }
  else if (act === 'speak-ride') { const r = activeRide(); if (r) speak(rideSpeech(r) + (r.status === 'searching' ? '' : ' Embarque: ' + r.from + '. Destino: ' + r.to + '.'), true); }
  else if (act === 'voice-dest') {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { say('Este aparelho não aceita voz no navegador. Digite o destino.'); return; }
    try {
      const rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = (e) => { const text = e.results[0][0].transcript; const inp = document.querySelector('[data-form="request"] [name="to"]'); if (inp) { inp.value = text; S.dest = null; onType('to', text); } speak('Destino: ' + text + '. Escolha uma das sugestões na tela.', true); say('Destino: ' + text); };
      rec.onerror = () => say('Não consegui ouvir. Tente de novo ou digite o destino.');
      say('Pode falar o destino…'); rec.start();
    } catch (e) { say('Não consegui usar o microfone.'); }
  }
  else if (act === 'cancel') { run(() => updateDoc(doc(db, 'rides', b.dataset.id), { status: 'canceled', updatedAt: serverTimestamp() }), 'Corrida cancelada.'); }
  else if (act === 'advance') { run(() => updateDoc(doc(db, 'rides', b.dataset.id), { status: b.dataset.to, updatedAt: serverTimestamp() }), b.dataset.to === 'done' ? 'Corrida finalizada.' : 'Atualizado.'); }
  else if (act === 'toggle-online') {
    const next = !S.profile.online;
    run(async () => { await updateDoc(doc(db, 'users', S.user.uid), { online: next }); S.profile.online = next; });
  }
});
setInterval(() => {
  try { if (S.view === 'app' && S.profile && S.profile.role === 'passenger') { const a = activeRide(); if (a && a.status === 'searching' && (a.modality === 'women' || a.genderPref === 'woman' || a.genderPref === 'man')) render(); } } catch (e) {}
}, 30000);
</script>
