<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rota10">
<title>Rota10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #F2F6F3; --surface: #FFFFFF; --fg: #0F1F18; --muted: #566860; --line: #D5E0DA;
    --brand: #0B7A4D; --brand-ink: #FFFFFF; --brand-soft: #DCF1E5;
    --fee: #8A5D06; --fee-soft: #FAEFD3; --danger: #B3261E; --danger-soft: #FBE3E0;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1410; --surface: #121D18; --fg: #E6F0EA; --muted: #92A89C; --line: #25352D;
      --brand: #3CCB8B; --brand-ink: #052416; --brand-soft: #123624;
      --fee: #E6B450; --fee-soft: #35290F; --danger: #FF8A80; --danger-soft: #3B1A18;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
    padding-block: max(16px, env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .shell { max-width: 560px; margin: 0 auto; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  h2 { font-size: 18px; line-height: 1.25; margin-bottom: 10px; }
  button, input { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .stack { display: grid; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
  .card.hl { border: 2px solid var(--brand); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .wordmark { font: 700 26px/1 var(--font-display); letter-spacing: -0.02em; }
  .wordmark b { color: var(--brand); }
  .who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--line); color: var(--muted); }
  .pill.on { background: var(--brand-soft); color: var(--brand); }
  .pill.fee { background: var(--fee-soft); color: var(--fee); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .link { appearance: none; border: 0; background: none; color: var(--brand); font: 600 14px var(--font-body); cursor: pointer; padding: 8px 4px; min-height: 40px; }
  .btn { appearance: none; border: 1px solid transparent; border-radius: 12px; min-height: 50px; padding: 0 18px; font: 600 16px var(--font-body); cursor: pointer; width: 100%; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btns { display: grid; gap: 10px; margin-top: 12px; }
  .field { display: grid; gap: 6px; font-weight: 500; font-size: 13px; color: var(--muted); min-width: 0; margin-bottom: 12px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
    font: 500 16px var(--font-body); min-height: 48px; padding: 0 12px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface); color: var(--fg); width: 100%;
  }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 14px var(--font-body); min-height: 44px; border-radius: 9px; cursor: pointer; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); }
  .radios { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .radios label { display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-weight: 600; font-size: 14px; color: var(--fg); cursor: pointer; }
  .radios input { width: 18px; height: 18px; accent-color: var(--brand); }
  .err { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--danger-soft); color: var(--danger); font-size: 14px; }
  .banner { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; background: var(--fee-soft); color: var(--fee); font-size: 14px; }
  .route { display: grid; gap: 6px; margin: 8px 0; }
  .route > div { display: flex; align-items: flex-start; gap: 10px; overflow-wrap: anywhere; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 7px; background: var(--brand); }
  .dot.b { background: var(--fg); }
  .callrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .price { font: 700 28px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
  .note { margin: 8px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 8px; font-size: 14px; overflow-wrap: anywhere; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .kpi { padding: 12px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  .kpi .v { font: 700 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi.fee { background: var(--fee-soft); border-color: transparent; } .kpi.fee .v { color: var(--fee); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 420px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); } td.num, th.num { text-align: right; }
  .foot { margin: 18px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
  .center { min-height: 50vh; display: grid; place-items: center; color: var(--muted); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 460px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 20; }
  a { color: var(--brand); font-weight: 600; }
  a.btn { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; line-height: 1.25; padding-block: 8px; }
  .btn.sos { background: #C62828; color: #fff; border-color: #C62828; }
  .sosgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sosgrid .wide { grid-column: 1 / -1; }
  .mapbox { position: relative; z-index: 0; isolation: isolate; height: 280px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
  .mk { background: none; border: 0; }
  .pin { font-size: 26px; line-height: 34px; text-align: center; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .drv { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); flex: none; background: var(--bg); }
  .carimg { display: block; width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); margin-top: 10px; }
  .plate { display: inline-block; font: 700 18px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; padding: 6px 10px; border: 2px solid #111; border-radius: 6px; background: #fff; color: #111; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .photobox { border: 1px dashed var(--line); border-radius: 10px; padding: 8px; text-align: center; font-size: 13px; color: var(--muted); min-width: 0; }
  .photobox img, .photobox .ph { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; display: grid; place-items: center; margin-bottom: 6px; background: var(--bg); }
  .photobox label { cursor: pointer; color: var(--brand); font-weight: 600; display: block; padding: 6px 0; }
</style>
</head>
<body>
<div class="shell"><div id="app"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, where, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7BjOoaRldgrynspRuX_z1FsJk0Onsz6g",
  authDomain: "rota10-b4257.firebaseapp.com",
  projectId: "rota10-b4257",
  storageBucket: "rota10-b4257.firebasestorage.app",
  messagingSenderId: "61157002380",
  appId: "1:61157002380:web:37949abb78a7ddb8e73fa9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- utilidades ---------- */
const FEE = 0.10;
const STATUS = { searching: 'Procurando motorista', accepted: 'Motorista a caminho', arrived: 'Motorista chegou', ongoing: 'Em viagem', done: 'Finalizada', canceled: 'Cancelada' };
const ACTIVE = ['searching', 'accepted', 'arrived', 'ongoing'];
const NEXT = {
  accepted: { to: 'arrived', label: 'Cheguei ao embarque' },
  arrived: { to: 'ongoing', label: 'Iniciar corrida' },
  ongoing: { to: 'done', label: 'Finalizar corrida' }
};
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (c) => ((c || 0) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const parseMoney = (s) => { const n = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) : NaN; };
const ms = (r) => (r.createdAt && r.createdAt.toDate ? r.createdAt.toDate().getTime() : Date.now());
const when = (r) => new Date(ms(r)).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const waLink = (phone) => { const d = String(phone || '').replace(/\D/g, ''); if (d.length < 10) return ''; return 'https://wa.me/' + (d.length <= 11 ? '55' + d : d); };
const plateFmt = (p) => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const PLATE_RE = /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/;
const safeImg = (s) => (typeof s === 'string' && s.startsWith('data:image/jpeg;base64,') ? s : '');
const telHref = (phone) => { const d = String(phone || '').replace(/\D/g, ''); if (d.length < 10) return ''; return 'tel:+' + (d.length <= 11 ? '55' + d : d); };
const dist = (a, b, c, d) => { const R = 6371, t = (x) => x * Math.PI / 180, dl = t(c - a), dg = t(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const kmFmt = (k) => (k < 1 ? Math.round(k * 1000 / 10) * 10 + ' m' : k.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' km');
function resizeImage(file, max, q, square) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sw = square ? Math.min(img.width, img.height) : img.width, sh = square ? sw : img.height;
      const sx = square ? (img.width - sw) / 2 : 0, sy = square ? (img.height - sh) / 2 : 0;
      const s = Math.min(1, max / Math.max(sw, sh)), w = Math.round(sw * s), h = Math.round(sh * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      let out = c.toDataURL('image/jpeg', q);
      while (out.length > 130000 && q > 0.3) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
const friendly = (e) => {
  const c = (e && e.code) || '';
  const map = {
    'auth/email-already-in-use': 'Esse e-mail já tem conta. Toque em Entrar.',
    'auth/invalid-email': 'E-mail inválido. Confira se digitou certo.',
    'auth/weak-password': 'Senha fraca. Use pelo menos 6 caracteres.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espere um pouco e tente de novo.',
    'auth/network-request-failed': 'Sem internet. Confira a conexão e tente de novo.',
    'auth/operation-not-allowed': 'O login por e-mail e senha não está ativado no Firebase.',
    'auth/unauthorized-domain': 'Este endereço do site não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).',
    'permission-denied': 'Sem permissão. Confira se as regras do Firestore foram publicadas.',
    'unavailable': 'Sem conexão com o servidor. Tente de novo.'
  };
  return map[c] || ('Algo deu errado' + (c ? ' (' + c + ')' : '') + '. Tente de novo.');
};

/* ---------- estado ---------- */
const S = { view: 'loading', mode: 'login', role: 'passenger', user: null, profile: null, rides: [], open: [], err: '', banner: '', busy: false, toast: '',
  draft: { face: null, car: null }, editVehicle: false, editEmerg: false, pickup: null, myPos: null };
let pendingProfile = null;
let unsubs = [];
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let toastTimer = null;
function say(msg) { $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.hidden = true; }, 3500); }

/* ---------- telas ---------- */
const brand = '<span class="wordmark">Rota<b>10</b></span>';
const route = (r) => '<div class="route"><div><span class="dot"></span><span>' + esc(r.from) + '</span></div><div><span class="dot b"></span><span>' + esc(r.to) + '</span></div></div>';
const contact = (name, phone) => {
  const w = waLink(phone);
  return '<div class="small"><b>' + esc(name || '') + '</b>' + (phone ? ' · ' + esc(phone) : '') + (w ? ' · <a href="' + w + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>';
};

const DRIVER_ACTIVE = ['accepted', 'arrived', 'ongoing'];
const activeRide = () => {
  if (!S.profile) return null;
  const list = S.rides.slice().sort((a, b) => ms(b) - ms(a));
  const set = S.profile.role === 'driver' ? DRIVER_ACTIVE : ACTIVE;
  return list.find((r) => set.includes(r.status)) || null;
};

function drvCard(r) {
  const face = safeImg(r.driverPhoto), car = safeImg(r.carPhoto), w = waLink(r.driverPhone);
  return '<div class="drv">' + (face ? '<img class="avatar" src="' + esc(face) + '" alt="Foto do motorista">' : '') +
    '<div style="min-width:0"><b>' + esc(r.driverName) + '</b>' +
    '<div class="small muted">' + esc([r.carBrand, r.carModel, r.carColor].filter(Boolean).join(' · ')) + '</div>' +
    (r.carPlate ? '<div style="margin-top:6px"><span class="plate">' + esc(r.carPlate) + '</span></div>' : '') + '</div></div>' +
    (car ? '<img class="carimg" src="' + esc(car) + '" alt="Foto do carro">' : '') +
    '<div class="small" style="margin-top:8px">' + (r.driverPhone ? esc(r.driverPhone) : '') + (w ? ' · <a href="' + w + '" target="_blank" rel="noopener">WhatsApp</a>' : '') + '</div>';
}

function mapInfoText(r) {
  if (!r) return '';
  if (r.status === 'ongoing') return 'Em viagem.';
  if (S.profile.role === 'driver') {
    if (!S.myPos) return 'Buscando o seu GPS…';
    if (r.pickupLat != null) return 'Passageiro a ' + kmFmt(dist(S.myPos.lat, S.myPos.lng, r.pickupLat, r.pickupLng)) + ' de você.';
    return 'Sua localização está sendo enviada ao passageiro.';
  }
  if (r.driverLat == null) return 'Aguardando o motorista começar o deslocamento.';
  const age = r.locAt && r.locAt.toDate ? Math.round((Date.now() - r.locAt.toDate().getTime()) / 60000) : 0;
  const base = r.pickupLat != null ? 'Motorista a ' + kmFmt(dist(r.driverLat, r.driverLng, r.pickupLat, r.pickupLng)) + ' de você.' : 'Motorista a caminho.';
  return base + (age >= 2 ? ' Última posição há ' + age + ' min.' : '');
}

const mapCard = (r) => '<div class="card"><div id="mapslot" class="mapbox"></div><div class="callrow small" style="margin-top:8px"><span id="mapinfo">' + esc(mapInfoText(r)) + '</span><button class="link" data-act="recenter">Centralizar</button></div></div>';

function photoBox(kind, label, src) {
  return '<div class="photobox">' + (src ? '<img src="' + esc(src) + '" alt="' + esc(label) + '">' : '<div class="ph">Sem foto</div>') +
    '<label>' + (src ? 'Trocar: ' : 'Escolher: ') + esc(label) + '<input type="file" accept="image/*" data-photo="' + kind + '" hidden></label></div>';
}

function vehicleForm(p, first) {
  const face = safeImg(S.draft.face) || safeImg(p.photo), car = safeImg(S.draft.car) || safeImg(p.carPhoto);
  const v = (x) => ' value="' + esc(x || '') + '"';
  return '<form class="card" data-form="vehicle"><h2>' + (first ? 'Cadastre seu veículo' : 'Seu veículo') + '</h2>' +
    '<p class="small muted" style="margin-top:0">O passageiro vê sua foto, o carro e a placa quando você aceita a corrida.</p>' +
    '<div class="photos">' + photoBox('face', 'sua foto', face) + photoBox('car', 'foto do carro', car) + '</div>' +
    '<label class="field">Marca<input type="text" name="carBrand" required maxlength="30" placeholder="Ex.: Chevrolet"' + v(p.carBrand) + '></label>' +
    '<label class="field">Modelo<input type="text" name="carModel" required maxlength="30" placeholder="Ex.: Onix"' + v(p.carModel) + '></label>' +
    '<label class="field">Cor<input type="text" name="carColor" required maxlength="20" placeholder="Ex.: Prata"' + v(p.carColor) + '></label>' +
    '<label class="field">Placa<input type="text" name="carPlate" required maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="ABC1D23"' + v(p.carPlate) + '></label>' +
    '<div class="btns"><button class="btn primary"' + (S.busy ? ' disabled' : '') + '>Salvar veículo</button>' +
    (first ? '' : '<button type="button" class="btn ghost" data-act="close-vehicle">Cancelar</button>') + '</div></form>';
}

function panicCard() {
  const p = S.profile, num = telHref(p.emergencyPhone), has = !!num;
  let h = '<div class="card"><h2>Segurança</h2><div class="sosgrid">' +
    '<a class="btn sos" href="tel:190">🚓 Polícia<br>190</a>' +
    '<a class="btn sos" href="tel:193">🚒 Bombeiros<br>193</a>';
  if (has) {
    h += '<a class="btn sos wide" href="' + num + '">📞 Ligar para ' + esc(p.emergencyName || 'meu contato') + '</a>' +
      '<button class="btn ghost wide" data-act="sos-wa">💬 Enviar minha localização por WhatsApp</button>';
  } else if (!S.editEmerg) {
    h += '<button class="btn ghost wide" data-act="edit-emerg">➕ Escolher meu contato de emergência</button>';
  }
  h += '</div>';
  if (S.editEmerg) {
    h += '<form data-form="emerg" style="margin-top:12px"><label class="field">Nome do contato<input type="text" name="ename" required maxlength="40" placeholder="Ex.: Ana Carla" value="' + esc(p.emergencyName || '') + '"></label>' +
      '<label class="field">Celular com DDD<input type="tel" name="ephone" required inputmode="tel" maxlength="20" placeholder="(34) 99999-9999" value="' + esc(p.emergencyPhone || '') + '"></label>' +
      '<div class="btns"><button class="btn primary"' + (S.busy ? ' disabled' : '') + '>Salvar contato</button><button type="button" class="btn ghost" data-act="close-emerg">Cancelar</button></div></form>';
  } else if (has) {
    h += '<button class="link" data-act="edit-emerg">Alterar contato de emergência</button>';
  }
  return h + '<p class="small muted" style="margin:8px 0 0">Os botões abrem o discador do celular e você confirma a ligação. Ambulância (SAMU): <a href="tel:192">192</a>.</p></div>';
}

function authView() {
  const su = S.mode === 'signup';
  return '<div class="top"><h1>' + brand + '</h1><span class="muted small">Dirija mais, fique com mais.</span></div>' +

/* mantém o que a pessoa está digitando quando a tela se atualiza */
const key = (i) => (i.form ? (i.form.dataset.form || '') + ':' + (i.form.dataset.id || '') + ':' : '') + i.name;
function render() {
  const saved = {}; let activeKey = null;
  $app.querySelectorAll('input[name]').forEach((i) => { if (i.type !== 'radio' && i.type !== 'file') saved[key(i)] = i.value; });
  const ae = document.activeElement; if (ae && ae.name && $app.contains(ae)) activeKey = key(ae);
  $app.innerHTML = viewHtml();
  $app.querySelectorAll('input[name]').forEach((i) => {
    if (i.type === 'radio' || i.type === 'file') return;
    const k = key(i); if (k in saved) i.value = saved[k];
    if (activeKey === k) i.focus();
  });
  mountMap();
  syncGps();
}

/* ---------- mapa (Leaflet + OpenStreetMap) ---------- */
let map = null, mapEl = null, mk = {}, userMoved = false, mapRide = null;
function setMarker(name, lat, lng, html) {
  if (lat == null || lng == null) { if (mk[name]) { map.removeLayer(mk[name]); delete mk[name]; } return; }
  if (mk[name]) mk[name].setLatLng([lat, lng]);
  else mk[name] = L.marker([lat, lng], { icon: L.divIcon({ className: 'mk', html: html, iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map);
}
function updateMarkers() {
  if (!map || !document.getElementById('mapslot') || !S.profile) return;
  const r = activeRide(); if (!r) return;
  if (mapRide !== r.id) { mapRide = r.id; userMoved = false; }
  const driver = S.profile.role === 'driver';
  const pk = r.pickupLat != null ? [r.pickupLat, r.pickupLng] : null;
  const car = driver ? (S.myPos ? [S.myPos.lat, S.myPos.lng] : null) : (r.driverLat != null ? [r.driverLat, r.driverLng] : null);
  setMarker('pick', pk ? pk[0] : null, pk ? pk[1] : null, '<div class="pin">📍</div>');
  setMarker('car', car ? car[0] : null, car ? car[1] : null, '<div class="pin">🚗</div>');
  const pts = [pk, car].filter(Boolean);
  if (!userMoved && pts.length) { if (pts.length === 1) map.setView(pts[0], 16); else map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 }); }
  const info = document.getElementById('mapinfo'); if (info) info.textContent = mapInfoText(r);
}
function mountMap() {
  const slot = document.getElementById('mapslot'); if (!slot) return;
  if (typeof L === 'undefined') { slot.innerHTML = '<p class="small muted" style="padding:12px">Não foi possível carregar o mapa. Confira a internet.</p>'; return; }
  if (!mapEl) {
    mapEl = document.createElement('div'); mapEl.style.cssText = 'width:100%;height:100%';
    map = L.map(mapEl).setView([-18.9186, -48.2772], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
    ['touchstart', 'mousedown', 'wheel'].forEach((e) => mapEl.addEventListener(e, () => { userMoved = true; }, { passive: true }));
  }
  if (mapEl.parentNode !== slot) slot.appendChild(mapEl);
  map.invalidateSize();
  updateMarkers();
}

/* ---------- GPS do motorista (envia a posição durante a corrida) ---------- */
const gps = { id: null, watch: null, last: 0, lock: null };
function wakeLock() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { gps.lock = l; }).catch(() => {}); } catch (e) {} }
function stopGps() {
  if (gps.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(gps.watch);
  gps.watch = null; gps.id = null; gps.last = 0; S.myPos = null;
  try { if (gps.lock) gps.lock.release(); } catch (e) {} gps.lock = null;
}
function syncGps() {
  const want = (S.profile && S.profile.role === 'driver' && S.view === 'app') ? activeRide() : null;
  if (!want) { if (gps.id) stopGps(); return; }
  if (gps.id === want.id) return;
  stopGps(); gps.id = want.id;
  if (!navigator.geolocation) { say('Este aparelho não tem localização.'); return; }
  gps.watch = navigator.geolocation.watchPosition((pos) => {
    S.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    updateMarkers();
    const now = Date.now();
    if (gps.id && now - gps.last >= 8000) {
      gps.last = now;
      updateDoc(doc(db, 'rides', gps.id), { driverLat: +S.myPos.lat.toFixed(5), driverLng: +S.myPos.lng.toFixed(5), locAt: serverTimestamp() }).catch(() => {});
    }
  }, () => { say('Ative a localização no navegador para o passageiro te acompanhar no mapa.'); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  wakeLock();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && gps.id) wakeLock(); });

/* ---------- dados em tempo real ---------- */
function stopListeners() { unsubs.forEach((u) => { try { u(); } catch (e) {} }); unsubs = []; }
function listenError(e) { S.banner = friendly(e); render(); }
function startListeners() {
  const uid = S.user.uid, role = S.profile.role, rides = collection(db, 'rides');
  const snapList = (snap) => snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  if (role === 'admin') {
    unsubs.push(onSnapshot(rides, (s) => { S.rides = snapList(s); S.banner = ''; render(); }, listenError));
  } else if (role === 'driver') {
    unsubs.push(onSnapshot(query(rides, where('driverId', '==', uid)), (s) => { S.rides = snapList(s); S.banner = ''; render(); }, listenError));
    unsubs.push(onSnapshot(query(rides, where('status', '==', 'searching')), (s) => { S.open = snapList(s); S.banner = ''; render(); }, listenError));
  } else {
    unsubs.push(onSnapshot(query(rides, where('passengerId', '==', uid)), (s) => { S.rides = snapList(s); S.banner = ''; render(); }, listenError));
  }
}

onAuthStateChanged(auth, async (u) => {
  stopListeners();
  S.user = u; S.profile = null; S.rides = []; S.open = []; S.banner = '';
  S.draft = { face: null, car: null }; S.editVehicle = false; S.editEmerg = false; S.pickup = null;
  if (!u) { stopGps(); S.view = 'auth'; S.mode = 'login'; S.busy = false; render(); return; }
  S.view = 'loading'; render();
  try {
    if (pendingProfile) {
      const pp = pendingProfile; pendingProfile = null;
      await setDoc(doc(db, 'users', u.uid), Object.assign({}, pp, { createdAt: serverTimestamp() }));
      S.profile = pp;
    } else {
      const snap = await getDoc(doc(db, 'users', u.uid));
      S.profile = snap.exists() ? snap.data() : null;
    }
    S.err = '';
  } catch (e) { pendingProfile = null; S.err = friendly(e); }
  S.busy = false;
  if (S.profile) { S.view = 'app'; startListeners(); } else { S.view = 'profile'; }
  render();
});

async function run(fn, okMsg) {
  if (S.busy) return;
  S.busy = true; render();
  try { await fn(); if (okMsg) say(okMsg); } catch (e) { say(friendly(e)); }
  S.busy = false; render();
}

document.addEventListener('submit', async (ev) => {
  const form = ev.target.closest('form[data-form]'); if (!form) return;
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(form).entries());
  const kind = form.dataset.form, uid = S.user && S.user.uid;
  if (kind === 'login') {
    S.busy = true; S.err = ''; render();
    try { await signInWithEmailAndPassword(auth, f.email.trim(), f.password); }
    catch (e) { S.err = friendly(e); S.busy = false; render(); }
  } else if (kind === 'signup') {
    S.busy = true; S.err = ''; render();
    pendingProfile = { name: f.name.trim(), phone: (f.phone || '').trim(), role: f.role === 'driver' ? 'driver' : 'passenger', online: false };
    try { await createUserWithEmailAndPassword(auth, f.email.trim(), f.password); }
    catch (e) { pendingProfile = null; S.err = friendly(e); S.busy = false; render(); }
  } else if (kind === 'profile') {
    S.busy = true; S.err = ''; render();
    const p = { name: f.name.trim(), phone: (f.phone || '').trim(), role: f.role === 'driver' ? 'driver' : 'passenger', online: false };
    try { await setDoc(doc(db, 'users', uid), Object.assign({}, p, { createdAt: serverTimestamp() })); S.profile = p; S.view = 'app'; startListeners(); }
    catch (e) { S.err = friendly(e); }
    S.busy = false; render();
  } else if (kind === 'request') {
    const from = f.from.trim(), to = f.to.trim();
    if (!from || !to) return;
    run(() => addDoc(collection(db, 'rides'), {
      passengerId: uid, passengerName: S.profile.name, passengerPhone: S.profile.phone || '',
      from, to, note: (f.note || '').trim(), status: 'searching',
      pickupLat: S.pickup ? S.pickup.lat : null, pickupLng: S.pickup ? S.pickup.lng : null,
      driverId: null, driverName: null, driverPhone: null, cents: null, feeCents: null, netCents: null,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    }).then(() => { S.pickup = null; }), 'Pedido enviado. Aguarde um motorista aceitar.');
  } else if (kind === 'accept') {
    const cents = parseMoney(f.price), p = S.profile;
    if (!p.vehicleOk) { say('Cadastre seu veículo antes de aceitar corridas.'); return; }
    if (!(cents >= 300 && cents <= 100000)) { say('Informe um valor entre R$ 3,00 e R$ 1.000,00.'); return; }
    const feeCents = Math.round(cents * FEE), id = form.dataset.id;
    run(() => updateDoc(doc(db, 'rides', id), {
      status: 'accepted', driverId: uid, driverName: p.name, driverPhone: p.phone || '',
      driverPhoto: p.photo, carPhoto: p.carPhoto, carBrand: p.carBrand, carModel: p.carModel, carColor: p.carColor, carPlate: p.carPlate,
      cents, feeCents, netCents: cents - feeCents, updatedAt: serverTimestamp()
    }), 'Corrida aceita. Siga até o passageiro.');
  } else if (kind === 'vehicle') {
    const plate = plateFmt(f.carPlate), p = S.profile;
    if (!PLATE_RE.test(plate)) { say('Placa inválida. Exemplo: ABC1D23.'); return; }
    const face = safeImg(S.draft.face) || safeImg(p.photo), car = safeImg(S.draft.car) || safeImg(p.carPhoto);
    if (!face || !car) { say('Envie a sua foto e a foto do carro.'); return; }
    const data = { carBrand: f.carBrand.trim(), carModel: f.carModel.trim(), carColor: f.carColor.trim(), carPlate: plate, photo: face, carPhoto: car, vehicleOk: true };
    run(async () => { await updateDoc(doc(db, 'users', uid), data); Object.assign(S.profile, data); S.draft = { face: null, car: null }; S.editVehicle = false; }, 'Veículo salvo.');
  } else if (kind === 'emerg') {
    const phone = f.ephone.trim(), name = f.ename.trim();
    if (phone.replace(/\D/g, '').length < 10) { say('Digite o celular com DDD.'); return; }
    run(async () => { await updateDoc(doc(db, 'users', uid), { emergencyName: name, emergencyPhone: phone }); S.profile.emergencyName = name; S.profile.emergencyPhone = phone; S.editEmerg = false; }, 'Contato de emergência salvo.');
  }
});

document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.name === 'role') S.role = t.value;
  if (t.dataset && t.dataset.photo && t.files && t.files[0]) {
    const kind = t.dataset.photo;
    try { S.draft[kind] = await resizeImage(t.files[0], kind === 'face' ? 220 : 560, kind === 'face' ? 0.72 : 0.65, kind === 'face'); render(); }
    catch (e) { say('Não consegui ler essa foto. Tente outra.'); }
  }
});

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'mode-login' || act === 'mode-signup') { S.mode = act === 'mode-signup' ? 'signup' : 'login'; S.err = ''; render(); }
  else if (act === 'logout') { signOut(auth); }
  else if (act === 'edit-vehicle') { S.editVehicle = true; render(); window.scrollTo(0, 0); }
  else if (act === 'close-vehicle') { S.editVehicle = false; S.draft = { face: null, car: null }; render(); }
  else if (act === 'edit-emerg') { S.editEmerg = true; render(); }
  else if (act === 'close-emerg') { S.editEmerg = false; render(); }
  else if (act === 'recenter') { userMoved = false; updateMarkers(); }
  else if (act === 'fee-paid') { run(() => updateDoc(doc(db, 'rides', b.dataset.id), { feePaid: b.dataset.v === '1', feePaidAt: serverTimestamp() })); }
  else if (act === 'use-loc') {
    if (!navigator.geolocation) { say('Este aparelho não tem localização.'); return; }
    say('Buscando sua localização…');
    navigator.geolocation.getCurrentPosition((pos) => {
      S.pickup = { lat: +pos.coords.latitude.toFixed(5), lng: +pos.coords.longitude.toFixed(5) };
      const inp = document.querySelector('[data-form="request"] [name="from"]');
      if (inp && !inp.value.trim()) inp.value = 'Minha localização atual (GPS)';
      render(); say('Localização capturada.');
    }, () => say('Não consegui pegar sua localização. Ligue o GPS e permita no navegador.'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
  }
  else if (act === 'sos-wa') {
    const r = activeRide(), w = waLink(S.profile.emergencyPhone); if (!w) return;
    const go = (loc) => {
      let t = '🚨 PRECISO DE AJUDA! Estou em uma corrida pelo Rota10.';
      if (r && r.driverId) t += '\nMotorista: ' + r.driverName + '\nCarro: ' + [r.carBrand, r.carModel, r.carColor].filter(Boolean).join(' ') + '\nPlaca: ' + (r.carPlate || '');
      if (r) t += '\nDe: ' + r.from + '\nPara: ' + r.to;
      if (loc) t += '\nMinha localização: https://maps.google.com/?q=' + loc.lat + ',' + loc.lng;
      window.location.href = w + '?text=' + encodeURIComponent(t);
    };
    if (!navigator.geolocation) { go(null); return; }
    navigator.geolocation.getCurrentPosition((pos) => go({ lat: pos.coords.latitude.toFixed(5), lng: pos.coords.longitude.toFixed(5) }), () => go(null), { timeout: 6000, maximumAge: 30000, enableHighAccuracy: true });
  }
  else if (act === 'cancel') { run(() => updateDoc(doc(db, 'rides', b.dataset.id), { status: 'canceled', updatedAt: serverTimestamp() }), 'Corrida cancelada.'); }
  else if (act === 'advance') { run(() => updateDoc(doc(db, 'rides', b.dataset.id), { status: b.dataset.to, updatedAt: serverTimestamp() }), b.dataset.to === 'done' ? 'Corrida finalizada.' : 'Atualizado.'); }
  else if (act === 'toggle-online') {
    const next = !S.profile.online;
    run(async () => { await updateDoc(doc(db, 'users', S.user.uid), { online: next }); S.profile.online = next; });
  }
});
</script>
</body>
</html>
